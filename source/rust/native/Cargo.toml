[package]
name = "index-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "intelligence-index"
path = "src/main.rs"

[dependencies]
index-core.workspace = true
anyhow.workspace = true
serde_json.workspace = true
regex.workspace = true
tiny_http = "0.12"
ureq = { version = "3.5", default-features = false, features = ["native-tls", "gzip", "brotli"] }
url = "2.5"
aes-gcm = "0.10"
sha2 = "0.10"
flate2 = "1"
scraper = { version = "0.24", default-features = false }
lopdf = { version = "0.47", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
getrandom = "0.3"
hex = "0.4"
percent-encoding = "2.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_ProcessStatus", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security"] }
