[workspace]
members = ["rust/core", "rust/native", "rust/ui", "rust/xtask"]
resolver = "2"

[workspace.package]
version = "1.0.2"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1"

serde_json = { version = "1", features = ["arbitrary_precision"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
index-core = { path = "rust/core" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
debug = false

[profile.release.package.index-ui]
opt-level = "z"
